name: shell-checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep

      - name: Shell syntax check
        run: |
          mapfile -t shell_files < <(
            printf '%s\n' mkconfig.sh
            rg --files scripts tests/smoke -g '*.sh'
          )
          printf 'syntax-check %s\n' "${shell_files[@]}"
          bash -n "${shell_files[@]}"

      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(
            printf '%s\n' mkconfig.sh
            rg --files scripts tests/smoke -g '*.sh'
          )
          printf 'shellcheck %s\n' "${shell_files[@]}"
          shellcheck -S error "${shell_files[@]}"

      - name: Smoke checks
        run: ./tests/smoke/run.sh --profile both

  maker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The maker must build from a bare clone of this repository, with no
      # sibling checkout of anything. That property is the whole reason the
      # previous desktop app was removed, so it is a CI gate rather than a
      # convention.
      - name: Build yggdrasil-maker
        run: cargo build --manifest-path yggdrasil-maker/Cargo.toml --locked

      - name: Test yggdrasil-maker
        run: cargo test --manifest-path yggdrasil-maker/Cargo.toml --locked
